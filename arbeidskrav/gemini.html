<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telle tegn i ord</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }

    .kort {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      color: #333;
    }

    .input-gruppe {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    button {
      padding: 0.5rem 1rem;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #0052a3;
    }

    #resultat {
      font-weight: 600;
      color: #222;
      min-height: 1.5em;
    }
  </style>
</head>
<body>

  <div class="kort">
    <h1>Tell antall tegn</h1>
    <div class="input-gruppe">
      <input type="text" id="ordInput" placeholder="Skriv et ord her...">
      <button onclick="tellTegn()">Tell</button>
    </div>
    <div id="resultat"></div>
  </div>

  <script>
    function tellTegn() {
      const inputFelt = document.getElementById('ordInput');
      const resultatFelt = document.getElementById('resultat');
      const ord = inputFelt.value;

      if (ord.trim() === '') {
        resultatFelt.textContent = 'Vennligst skriv inn et ord først.';
        return;
      }

      const antallTegn = ord.length;
      resultatFelt.textContent = `Ordet ${ord} består av ${antallTegn} tegn`;
    }
  </script>

</body>
</html>
